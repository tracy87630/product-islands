<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>產品有事群島｜Tracy Liu</title>
<meta name="description" content="劉美伶 Tracy Liu 的互動作品集：每座六角群島是一段經歷，每一格是一個處理過的產品問題。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Roboto+Slab:wght@700;800;900&family=Nunito:wght@600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E9DC; --paper:#FBF6EA; --paper2:#F3ECDA; --ink:#2F4A3A; --ink2:#4D5E50; --muted:#7F8B7C;
  --line:#E3D9C2; --accent:#C0803B; --accent-soft:#F5E8CF; --shadow:0 10px 30px rgba(47,74,58,.16),0 2px 6px rgba(47,74,58,.08);
  --sky:#8DB0A4; --sky2:#A9C4B6; --meadow:#6F9A57; --meadow2:#8DB56D; --trail:#D9A866; --cloud:#F6EBCF; --tent:#3F6B4A; --kraft:#EADDBE;
  --slab:"Roboto Slab","Noto Sans TC",sans-serif; --round:"Nunito","Noto Sans TC",sans-serif;
  --r:20px; --panel:372px;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --serif:"Fraunces",Georgia,serif;
  --display:"Bricolage Grotesque","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#scene{position:fixed;inset:0;right:var(--panel)}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
.glass{background:rgba(251,246,234,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow)}

/* brand */
#brand{position:fixed;top:16px;left:16px;z-index:20;display:flex;align-items:center;gap:18px;padding:14px 22px 16px 20px;border-radius:var(--r);overflow:hidden;
  background:linear-gradient(135deg,#8FB2A5 0%,#6F9886 55%,#5A8468 100%);border:1px solid rgba(255,255,255,.45);box-shadow:var(--shadow);color:#fff}
#brand > div{position:relative;z-index:1}
#brand .logo{font-family:var(--slab);font-weight:900;font-size:34px;line-height:.92;letter-spacing:-.01em;color:#FFFDF6;text-shadow:0 2px 0 rgba(38,62,48,.45)}
#brand .logo span{display:block}
#brand .logo span:last-child{color:var(--cloud)}
#brand .t1{font-weight:900;font-size:21px;letter-spacing:.06em;text-shadow:0 1px 0 rgba(47,74,58,.3)}
#brand .t2{margin-top:5px;font-size:12.5px;display:flex;gap:6px;align-items:center;color:#F4F7F1}
#brand .t2 b{font-family:var(--slab);font-weight:800;font-size:13px;color:var(--cloud);letter-spacing:.01em}
#brand .t3{margin-top:6px;display:inline-block;font-family:var(--round);font-weight:800;font-size:11px;letter-spacing:.03em;color:#fff;background:rgba(38,62,48,.32);padding:2px 8px;border-radius:999px}

/* toolbar */
#toolbar{position:fixed;top:132px;left:16px;z-index:20;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100vw - var(--panel) - 32px)}
.tgroup{display:flex;gap:2px;padding:6px;border-radius:999px}
.tbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:46px;height:46px;padding:0 6px;border-radius:999px;font-size:11px;color:var(--ink2);transition:background .2s,color .2s,transform .15s}
.tbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tbtn:hover{background:rgba(63,107,74,.08)}
.tbtn:active{transform:scale(.94)}
.tbtn.on{background:var(--tent);color:#FFF8E7;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.tgroup.time .tbtn{min-width:40px}
#topright{position:fixed;top:16px;right:calc(var(--panel) + 16px);z-index:20;display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:12px;font-size:13px;font-weight:500}
.pill svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill:hover{background:#fff}
#btnList{display:none}

/* labels */
#labels{position:fixed;inset:0;right:var(--panel);pointer-events:none;z-index:10;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:auto;cursor:pointer;
  background:rgba(255,252,248,.95);border-radius:999px;padding:4px 10px 4px 6px;font-size:12px;font-weight:500;color:var(--ink);
  box-shadow:0 3px 10px rgba(60,40,25,.16);display:flex;align-items:center;gap:5px;transition:opacity .25s,box-shadow .2s;will-change:transform}
.lbl b{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:999px;padding:1px 5px}
.lbl::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:0 0 2px 0;z-index:-1}
.lbl:hover,.lbl.active{box-shadow:0 0 0 2px var(--c),0 4px 14px rgba(60,40,25,.2)}
.lbl.dim{opacity:.28}
.lbl.isle{background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:6px 13px 6px 8px}
.lbl.isle b{background:var(--c);color:#fff}
.lbl.char{background:#fff;font-size:11px;padding:2px 9px 2px 3px;gap:4px;border:1.5px solid var(--c)}
.lbl.char i{width:16px;height:16px;border-radius:50%;background:var(--c);color:#fff;font-style:normal;font-size:9px;font-weight:700;display:grid;place-items:center}
body:not(.showcrew) .lbl.char{opacity:0;pointer-events:none}
.lbl.isle small{font-family:var(--mono);font-size:10px;font-weight:500;opacity:.7;margin-left:2px}
body.nonames .lbl:not(.isle){opacity:0;pointer-events:none}
body.far .lbl:not(.isle):not(:hover):not(.active):not(.hit) .tx{display:none}
body.far .lbl:not(.isle):not(:hover):not(.active):not(.hit){padding:3px}
body.far .lbl.dim{opacity:.18}

/* tooltip */
#tip{position:fixed;z-index:30;pointer-events:none;padding:8px 12px;border-radius:12px;font-size:12.5px;max-width:240px;opacity:0;transform:translate(14px,14px);transition:opacity .15s}
#tip strong{display:block;font-size:13px;margin-bottom:2px}
#tip span{color:var(--muted)}

/* panel */
#panel{position:fixed;top:0;right:0;bottom:0;width:var(--panel);z-index:25;background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column}
#panel .head{padding:26px 24px 14px;background:linear-gradient(180deg,#DCE7DE 0%,rgba(251,246,234,0) 100%)}
#panel h1,#panel .stats b{font-family:var(--slab)}
#panel .tagline{display:inline-block;margin:0 0 10px;font-family:var(--round);font-weight:800;font-size:10.5px;letter-spacing:0;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;color:var(--tent);background:#E1EBDF;border:1px solid #CFDCCB;padding:3px 10px;border-radius:999px}
#panel .stats b{font-style:normal;font-weight:800}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
#panel h1{font-size:27px;font-weight:900;margin:10px 0 8px;letter-spacing:.02em}
#panel .sub{font-size:12.5px;color:var(--ink2);line-height:1.7}
.stats{display:flex;gap:16px;margin-top:14px}
.stats div{font-size:11.5px;color:var(--muted)}
.stats b{display:block;font-family:var(--serif);font-style:italic;font-weight:700;font-size:26px;color:var(--ink);line-height:1.1}
.cta{margin:14px 24px 0;padding:13px 16px;border-radius:14px;background:linear-gradient(120deg,#E3EDE3,#F3ECD6);border:1px solid #CFDCCB;display:flex;align-items:center;gap:10px;text-align:left;width:calc(100% - 48px);transition:transform .2s}
.cta:hover{transform:translateY(-2px)}
.cta strong{font-size:14px;display:block}
.cta span{font-size:12px;color:var(--ink2)}
.cta i{margin-left:auto;font-style:normal;color:var(--accent);font-size:18px}
.search{margin:14px 24px 0;position:relative}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 14px 0 38px;font:inherit;font-size:13.5px;color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:13px;top:13px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 24px 0}
.tab{height:42px;border-radius:12px;border:1px solid var(--line);font-size:13.5px;font-weight:700;background:#fff}
.tab.on{background:var(--tent);color:#FFF8E7;border-color:var(--tent)}
#list{flex:1;overflow:auto;padding:10px 12px 20px;margin-top:6px;scrollbar-width:thin}
.isle-row{display:flex;align-items:center;gap:10px;width:100%;padding:14px 12px 10px;text-align:left;border-radius:12px}
.isle-row:hover{background:var(--paper2)}
.isle-row .dot{width:12px;height:12px;border-radius:4px;background:var(--c);transform:rotate(45deg)}
.isle-row .nm{font-weight:900;font-size:15px}
.isle-row .yr{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:auto}
.isle-role{font-size:11.5px;color:var(--muted);padding:0 12px 6px 34px;margin-top:-4px}
.prow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;text-align:left;transition:background .15s}
.prow:hover{background:var(--paper2)}
.prow.active{background:color-mix(in srgb,var(--c) 12%,#fff);box-shadow:inset 3px 0 0 var(--c)}
.prow .n{font-family:var(--serif);font-style:italic;font-weight:500;font-size:20px;color:var(--c);width:28px}
.prow .tt{font-size:14px;font-weight:500;flex:1}
.prow .mm{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.prow.hide{display:none}
.tagrow{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:12px;text-align:left}
.tagrow:hover{background:var(--paper2)}
.tagrow.on{background:var(--tent);color:#FFF8E7}
.tagrow .k{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);min-width:60px;text-align:center}
.tagrow.on .k{background:var(--trail);color:#fff}
.tagrow .tt{flex:1;font-size:14px;font-weight:500}
.tagrow .c{font-family:var(--serif);font-style:italic;font-size:18px}
.taghint{font-size:12px;color:var(--muted);padding:6px 12px 10px;line-height:1.6}
.foot{padding:14px 24px 18px;border-top:1px solid var(--line);display:flex;gap:14px;font-size:12.5px;align-items:center}
.foot a{color:var(--ink2);text-decoration:none;font-weight:500}
.foot a:hover{color:var(--accent)}
.foot .sp{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}

/* card */
#card{position:fixed;left:16px;top:132px;bottom:16px;width:380px;z-index:22;border-radius:22px;display:flex;flex-direction:column;
  transform:translateX(-420px);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.25,1.05),opacity .3s;pointer-events:none}
#card.open{transform:none;opacity:1;pointer-events:auto}
body.card-open #toolbar{opacity:0;pointer-events:none}
#toolbar{transition:opacity .3s}
#card .ch{display:flex;gap:14px;align-items:flex-start;padding:22px 22px 6px}
#card .num{flex:none;width:54px;height:54px;border-radius:16px;background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--c);display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-weight:700;font-size:24px}
#card h2{font-size:21px;font-weight:900;line-height:1.3;margin-top:4px}
#card .eyebrow{color:var(--c)}
#card .x{margin-left:auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
#card .x:hover{background:rgba(0,0,0,.06)}
#card .x svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2;fill:none}
#card .body{overflow:auto;padding:6px 22px 18px;scrollbar-width:thin}
#card .one{font-size:14px;line-height:1.7;color:var(--ink2);margin:6px 0 12px}
#card blockquote{border-left:3px solid var(--c);background:var(--paper2);padding:10px 14px;border-radius:0 12px 12px 0;font-size:13.5px;line-height:1.75;color:var(--ink2);margin-bottom:14px}
#card blockquote small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);margin-bottom:3px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.metric b{display:block;font-family:var(--serif);font-style:italic;font-weight:700;font-size:clamp(20px,2vw,26px);line-height:1.1;color:var(--ink);overflow-wrap:anywhere;letter-spacing:-.01em}
.metric span{font-size:12px;color:var(--muted);line-height:1.5;display:block;margin-top:2px}
.funnel{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:14px;font-family:var(--mono);font-size:11px}
.funnel span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.funnel i{color:var(--muted);font-style:normal}
#card h4{font-size:12px;font-family:var(--mono);letter-spacing:.1em;color:var(--muted);margin:4px 0 8px}
#card ol{list-style:none;counter-reset:s;margin-bottom:14px}
#card ol li{counter-increment:s;position:relative;padding:10px 12px 10px 40px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:13.5px;line-height:1.65;margin-bottom:6px}
#card ol li::before{content:counter(s);position:absolute;left:12px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fff}
button.chip:hover{border-color:var(--accent);color:var(--accent)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;color:var(--sc);background:var(--sb)}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.note{font-size:12px;color:var(--muted);line-height:1.65;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;margin-bottom:12px}
#card .nav{display:flex;gap:8px;padding:12px 22px 18px;border-top:1px solid var(--line)}
#card .nav button{flex:1;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500}
#card .nav button:hover{border-color:var(--ink)}
.about-skills{display:grid;gap:8px;margin-bottom:14px}
.about-skills div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6}
.about-skills b{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--accent);display:block;margin-bottom:2px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:12px;background:var(--ink);color:#fff;text-decoration:none;font-size:13px;font-weight:500}
.links a.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}

/* tour */
#tour{position:fixed;left:50%;bottom:22px;z-index:24;width:min(560px,calc(100vw - var(--panel) - 40px));border-radius:20px;padding:16px 18px;
  transform:translate(calc(-50% - var(--panel)/2),calc(100% + 40px));visibility:hidden;transition:transform .5s cubic-bezier(.2,.9,.25,1.05),visibility .5s}
#tour.open{transform:translate(calc(-50% - var(--panel)/2),0);visibility:visible}
#tour .row{display:flex;align-items:center;gap:10px}
#tour .yr{font-family:var(--mono);font-size:11px;color:var(--c);font-weight:700}
#tour h3{font-size:17px;font-weight:900;margin:3px 0 4px}
#tour p{font-size:13px;color:var(--ink2);line-height:1.65}
#tour .ctrl{display:flex;gap:6px;margin-top:12px;align-items:center}
#tour .ctrl button{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:500}
#tour .ctrl button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
#tour .bar{flex:1;display:flex;gap:4px;margin-left:8px}
#tour .bar i{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
#tour .bar i.done{background:var(--c)}
#tour .bar i.cur::after{content:"";position:absolute;inset:0;background:var(--c);transform-origin:left;transform:scaleX(var(--p,0))}

/* intro + loader */
#loader{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;transition:opacity .7s,visibility .7s}
#loader.gone{opacity:0;visibility:hidden}
#loader .in{text-align:center}
#loader .hexes{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
#loader .hexes i{width:22px;height:25px;background:var(--accent);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);animation:hop 1s ease-in-out infinite}
#loader .hexes i:nth-child(2){animation-delay:.12s;background:#3FA88E}
#loader .hexes i:nth-child(3){animation-delay:.24s;background:#F08A3C}
#loader .hexes i:nth-child(4){animation-delay:.36s;background:#6FA8DC}
#loader .hexes i:nth-child(5){animation-delay:.48s;background:#E3B23C}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
#loader p{font-size:14px;color:var(--ink2);letter-spacing:.06em}
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(239,229,216,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
#intro.open{opacity:1;visibility:visible}
#intro .box{width:min(440px,calc(100vw - 32px));background:var(--paper);border-radius:22px;padding:26px;box-shadow:var(--shadow);transform:translateY(16px);transition:transform .5s cubic-bezier(.2,.9,.25,1.05)}
#intro.open .box{transform:none}
#intro h2{font-size:24px;font-weight:900;margin:12px 0 10px}
#intro p{font-size:14px;line-height:1.8;color:var(--ink2)}
#intro .acts{display:flex;align-items:center;gap:10px;margin-top:22px}
#intro .acts .dots{display:flex;gap:5px;margin-right:auto}
#intro .acts .dots i{width:6px;height:6px;border-radius:6px;background:var(--line);transition:width .3s,background .3s}
#intro .acts .dots i.on{width:18px;background:var(--accent)}
#intro .acts button{height:42px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid var(--line);background:#fff}
#intro .acts button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}

/* night tint for floating UI */
body.night .lbl:not(.isle){background:rgba(255,246,230,.92)}

@media (max-width:860px){
  :root{--panel:0px}
  #panel{width:min(400px,100vw);transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.9,.25,1);box-shadow:var(--shadow)}
  body.panel-open #panel{transform:none}
  #btnList{display:flex}
  #topright{right:16px;top:auto;bottom:16px}
  #brand{padding:10px 14px;gap:10px}
  #brand .logo{font-size:26px}
  #brand .t1{font-size:16px}
  #brand .t2{font-size:11px}
  #toolbar{top:auto;bottom:66px;left:16px;right:16px;max-width:none}
  .tbtn{min-width:40px;height:40px;font-size:10px}
  .tgroup.time{display:none}
  #card{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:64vh;transform:translateY(110%)}
  #card.open{transform:none}
  #tour{width:calc(100vw - 24px);transform:translate(-50%,calc(100% + 40px))}
  #tour.open{transform:translate(-50%,0)}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
<script type="importmap">

    if (c.o.mode === 'swing'){ c.pend.rotation.x = Math.sin(t * 2.1) * .38; c.head.rotation.y = Math.sin(t * .8) * .25; continue; }
    if (c.o.mode === 'stand'){ posePose(c, t); c.head.rotation.y = Math.sin(t * 1.2 + c.off) * (c.o.pose === 'laptop' ? .1 : .35); c.g.position.y = c.y + Math.abs(Math.sin(t * 2)) * .006; continue; }
    const ph = (t + c.off) % 9;
    const walking = ph < 6;
    if (walking) c.a += c.speed * dt;
    const swing = walking ? Math.sin(t * 9 + c.off) * .55 : 0;
    c.legs[0].rotation.x = swing; c.legs[1].rotation.x = -swing;
    if (walking){ c.arms[0].rotation.set(-swing * .8, 0, 0); c.arms[1].rotation.set(swing * .8, 0, 0); c.head.rotation.x = 0; }
    else posePose(c, t);
    c.g.position.set(Math.cos(c.a) * c.r, c.y + (walking ? Math.abs(Math.sin(t * 9 + c.off)) * .012 : 0), Math.sin(c.a) * c.r);
    const face = walking ? -c.a + Math.PI : FACE_CAM();
    c.g.rotation.y += (((face - c.g.rotation.y + Math.PI * 3) % (Math.PI * 2)) - Math.PI) * Math.min(1, dt * 6);
    c.head.rotation.y = walking ? 0 : Math.sin(t * 1.5 + c.off) * .3;
  }
}

  night:{ bg:'#1D2740', sun:'#A9BCFF', si:.42, sp:[-8,14,-6], hs:'#55639A', hg:'#1B1C2C', hi:.5, water:'#244566', halo:'#2F5A7E', win:1.7, night:1 },
};
const todState = { from:TOD.day, to:TOD.day, k:1 };
const _c1 = new THREE.Color(), _c2 = new THREE.Color();
const lerpC = (a, b, k, out) => out.set(a).lerp(_c2.set(b), k);
function setTod(name){
  const cur = snapshotTod(); todState.from = cur; todState.to = TOD[name]; todState.k = 0;
  document.querySelectorAll('[data-tod]').forEach(b => b.classList.toggle('on', b.dataset.tod === name));
  document.body.classList.toggle('night', name === 'night');
}
let todNow = { ...TOD.day };
function snapshotTod(){ return { ...todNow, sp:[...todNow.sp] }; }
function applyTod(dt){
  if (todState.k < 1) todState.k = Math.min(1, todState.k + dt / 1.4);
  const k = ease(todState.k), a = todState.from, b = todState.to;
  const mix = key => '#' + lerpC(a[key], b[key], k, _c1).getHexString();
  todNow = { bg:mix('bg'), sun:mix('sun'), hs:mix('hs'), hg:mix('hg'), water:mix('water'), halo:mix('halo'),
    si:a.si + (b.si - a.si)*k, hi:a.hi + (b.hi - a.hi)*k, win:a.win + (b.win - a.win)*k, night:a.night + (b.night - a.night)*k,
    sp:a.sp.map((v,i) => v + (b.sp[i] - v)*k) };
  scene.background.set(todNow.bg); scene.fog.color.set(todNow.bg);
  sun.color.set(todNow.sun); sun.intensity = todNow.si; sun.position.set(...todNow.sp); sun.target.position.set(0,0,0);
  hemi.color.set(todNow.hs); hemi.groundColor.set(todNow.hg); hemi.intensity = todNow.hi;
  waterMat.color.set(todNow.water); haloMat.color.set(todNow.halo);
  winMat.emissiveIntensity = todNow.win; winMat.color.set(todNow.win > .5 ? '#FFE3A3' : '#A9CBD8');
  bulbMat.emissiveIntensity = .6 + todNow.night * 1.4; glowMat.emissiveIntensity = .9 + todNow.night;
  beams.forEach(m => m.opacity = todNow.night * .16);
  hTilt.uniforms.r.value = vTilt.uniforms.r.value = .52;
}

  if (innerWidth <= 860) document.body.classList.remove('panel-open');
  const row = listEl.querySelector(`.prow[data-id="${id}"]`); row && row.scrollIntoView({ block:'nearest', behavior:'smooth' });
}
function closeCard(goHome){
  card.classList.remove('open'); document.body.classList.remove('card-open');
  currentId = null; marker.visible = false; syncActive();
  if (goHome) flyTo(HOME.target, HOME.pos);
}
addEventListener('keydown', e => { if (e.key === 'Escape'){ if (tourOn) stopTour(true); else if (card.classList.contains('open')) closeCard(true); } });

/* ================= TOOLBAR ================= */
let paused = false, showRoute = true;
document.querySelectorAll('[data-tod]').forEach(b => b.onclick = () => setTod(b.dataset.tod));
$('#tNames').onclick = e => { const on = document.body.classList.toggle('nonames'); e.currentTarget.classList.toggle('on', !on); };
$('#tCrew').onclick = e => { const on = document.body.classList.toggle('showcrew'); e.currentTarget.classList.toggle('on', on); e.currentTarget.setAttribute('aria-pressed', on); };
$('#tRoute').onclick = e => { showRoute = !showRoute; dashMesh.visible = showRoute; boats.forEach(b => b.g.visible = showRoute); e.currentTarget.classList.toggle('on', showRoute); };
$('#tPause').onclick = e => { paused = !paused; e.currentTarget.classList.toggle('on', paused); e.currentTarget.querySelector('span').textContent = paused ? '播放' : '暫停'; };
$('#tBird').onclick = e => { const on = !e.currentTarget.classList.contains('on'); e.currentTarget.classList.toggle('on', on); closeCard(false); on ? flyTo(BIRD.target, BIRD.pos) : flyTo(HOME.target, HOME.pos); };
$('#tTour').onclick = () => tourOn ? stopTour(true) : startTour();
$('#btnHome').onclick = () => { closeCard(false); stopTour(false); setFilter(null); $('#q').value = ''; $('#tBird').classList.remove('on'); flyTo(HOME.target, HOME.pos); };
$('#btnList').onclick = () => document.body.classList.toggle('panel-open');
$('#btnHelp').onclick = () => openIntro(0);

/* ================= TOUR ================= */
const tourEl = $('#tour');
let tourOn = false, tourI = 0, tourT = 0, tourPlaying = true;
const TOUR_DUR = 7;
function renderTour(){
  const isle = isleById[TOUR_SEQ[tourI]];
  tourEl.style.setProperty('--c', isle.color);
  tourEl.innerHTML = `
    <div class="row"><span class="yr">航線導覽 ${pad(tourI+1)} / ${pad(TOUR_SEQ.length)}・${esc(isle.years)}</span></div>
    <h3>${esc(isle.name)}・${esc(isle.role)}</h3>
    <p>${esc(isle.tour)}</p>
    <div class="ctrl">
      <button data-t="prev">←</button><button class="pri" data-t="play">${tourPlaying ? '暫停' : '播放'}</button><button data-t="next">→</button>
      <div class="bar">${TOUR_SEQ.map((_, i) => `<i class="${i < tourI ? 'done' : i === tourI ? 'cur' : ''}"></i>`).join('')}</div>
      <button data-t="exit">離開</button>
    </div>`;
  tourEl.querySelector('[data-t=prev]').onclick = () => tourGo(tourI - 1);
  tourEl.querySelector('[data-t=next]').onclick = () => tourGo(tourI + 1);
  tourEl.querySelector('[data-t=play]').onclick = () => { tourPlaying = !tourPlaying; renderTour(); };
  tourEl.querySelector('[data-t=exit]').onclick = () => stopTour(true);
}
function tourGo(i){
  tourI = (i + TOUR_SEQ.length) % TOUR_SEQ.length; tourT = 0;
  const isle = isleById[TOUR_SEQ[tourI]];
  const target = isle.mid.clone(); target.y = .3;
  const dir = new THREE.Vector3(isle.mid.x - hubMid.x, 0, isle.mid.z - hubMid.z).normalize();
  const pos = target.clone().addScaledVector(dir, 7 + isle.radius * 2).add(new THREE.Vector3(0, 9 + isle.radius * 1.6, 0));
  flyTo(target, pos.lerp(target.clone().addScaledVector(VIEW_DIR, 14 + isle.radius * 3), .55), 2);
  setFilter(new Set(isle.projects.map(p => p.id)));
  renderTour();
}
function startTour(){
  closeCard(false); tourOn = true; tourPlaying = true;
  $('#tTour').classList.add('on'); tourEl.classList.add('open');
  if (innerWidth <= 860) document.body.classList.remove('panel-open');
  tourGo(0);
}
function stopTour(goHome){
  if (!tourOn) return;
  tourOn = false; $('#tTour').classList.remove('on'); tourEl.classList.remove('open'); setFilter(null);
  if (goHome) flyTo(HOME.target, HOME.pos);
}

/* ================= INTRO ================= */
const INTRO = [
  ['HELLO, VISITOR / 01', '每座群島是一段經歷', `5 座群島拼成我的職涯：從現在的 91APP，往回是 KKday、PChome、起點，還有放 side project 的實驗室。中間的 Tracy 港是關於我。每一格六角形，是一個我處理過的產品問題。`],
  ['HELLO, VISITOR / 02', '點一格，看我怎麼處理', `每格都有：當時的問題、我做了什麼、結果數字，以及目前狀態——上線、預估、原型，標得清清楚楚，不灌水。`],
  ['HELLO, VISITOR / 03', '換個角度逛', `右側「能力」可篩選 AI、數據、結帳金流等，橘色航線會把用到同一能力的專案串起來；或按工具列的「導覽」，像看履歷一樣，從現在往回走一遍。也可以把天色切到晚上看看。`],
];
const intro = $('#intro'), introBox = $('#introBox');
function openIntro(i){
  const [e, h, p] = INTRO[i];
  introBox.innerHTML = `<p class="eyebrow">${e}</p><h2>${h}</h2><p>${p}</p>
    <div class="acts"><div class="dots">${INTRO.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
    ${i < INTRO.length - 1 ? `<button data-a="skip">略過</button><button class="pri" data-a="next">下一步 →</button>` : `<button data-a="tour">開始導覽</button><button class="pri" data-a="skip">開始逛島</button>`}</div>`;
  intro.classList.add('open');
  introBox.querySelector('[data-a=skip]').onclick = closeIntro;
  const nx = introBox.querySelector('[data-a=next]'); if (nx) nx.onclick = () => openIntro(i + 1);
  const tr = introBox.querySelector('[data-a=tour]'); if (tr) tr.onclick = () => { closeIntro(); startTour(); };
}
function closeIntro(){ intro.classList.remove('open'); try { localStorage.setItem('isles-intro', '1'); } catch(e){} }

/* ================= LOOP ================= */
resize();
renderIsleList();
camera.position.set(28, 52, 62); controls.target.copy(HOME.target);
flyTo(HOME.target, HOME.pos, 3.2);
const clock = new THREE.Clock();
let t = 0, introAt = 0, started = false, startT = 0;
const tmpO = new THREE.Object3D();

function frame(){
  const dt = Math.min(clock.getDelta(), .05);
  if (!paused) t += dt;
  const real = clock.elapsedTime;

  // entry animation
  const since = started ? real - startT : 0;
  for (const tile of tiles){
    const u = tile.userData;
    const k = reduced ? 1 : clamp01((since - u.delay) / .9);
    const hoverLift = tile === hoverTile ? .12 : 0;
    u.lift += ((u.liftT + hoverLift) - u.lift) * Math.min(1, dt * 8);
    const entry = (1 - backOut(k)) * -3.2;
    tile.position.y = u.lift + entry;
    tile.visible = k > 0;
  }
  // ambient
  if (!paused){
    for (const f of anims) f(t, dt);
    animateCrew(t, dt);
    for (const w of walkers){ w.a += w.s * dt; w.p.position.set(Math.cos(w.a) * w.r, w.y + Math.abs(Math.sin(t*9 + w.a*10)) * .015, Math.sin(w.a) * w.r); w.p.rotation.y = -w.a + (w.s > 0 ? Math.PI : 0); }
    for (const c of clouds){ c.position.x += c.userData.s * dt; if (c.position.x > 34) c.position.x = -34; }
    { const hm = isleById.hub.mid, a = t * .35; plane.position.set(hm.x + Math.cos(a) * 4.4, 4 + Math.sin(t * .9) * .25, hm.z + Math.sin(a) * 4.4); plane.rotation.set(Math.sin(a * 2) * .06, -a - Math.PI / 2, .25); }
    for (const b of boats){ const u = (t * .012 + b.o) % 1; const p = route.getPointAt(u), tg = route.getTangentAt(u);
      b.g.position.set(p.x, .05 + Math.sin(t*2 + b.o*10) * .02, p.z); b.g.rotation.set(Math.sin(t*1.6 + b.o*5)*.05, Math.atan2(-tg.z, tg.x), 0); }
    for (let i = 0; i < wPos.count; i++){ const x = wBase[i*3], z = wBase[i*3+2]; wPos.array[i*3+1] = Math.sin(x*.55 + t*1.1) * .03 + Math.cos(z*.6 + t*.9) * .03; }
    wPos.needsUpdate = true;
    foams.forEach((f, i) => { const s = 1 + Math.sin(t*1.2 + i) * .025; f.scale.set(s, s, 1); f.material.opacity = (.35 + Math.sin(t*1.2 + i) * .2) * (1 - todNow.night * .7); });
    for (const r of arcRunners){ const u = (t * .45 + r.o) % 1; r.dot.position.copy(r.curve.getPoint(u)); }
  }
  // marker
  if (marker.visible && currentId){
    const tile = projById[currentId].tile;
    marker.position.set(tile.position.x, tile.position.y + tile.userData.topY + .03 + Math.sin(real*3)*.03, tile.position.z);
    const s = 1 + Math.sin(real*3)*.03; marker.scale.set(s, s, 1);
  }
  // camera fly
  if (fly){
    fly.t += dt; const k = ease(clamp01(fly.t / fly.dur));
    controls.target.lerpVectors(fly.ft, fly.tt, k); camera.position.lerpVectors(fly.fp, fly.tp, k);
    if (k >= 1) fly = null;
  }
  // tour progress
  if (tourOn && tourPlaying){
    tourT += dt; const cur = tourEl.querySelector('.bar i.cur'); if (cur) cur.style.setProperty('--p', clamp01(tourT / TOUR_DUR));
    if (tourT >= TOUR_DUR){ if (tourI === TOUR_SEQ.length - 1){ tourPlaying = false; renderTour(); } else tourGo(tourI + 1); }
  }
  applyTod(dt);
  controls.update();
  composer.render();
  updateLabels();
  requestAnimationFrame(frame);
}

// start: hide loader once first frames rendered, then raise islands
requestAnimationFrame(() => {
  frame();
  setTimeout(() => {
    $('#loader').classList.add('gone'); started = true; startT = clock.elapsedTime;
    let seen = false; try { seen = localStorage.getItem('isles-intro') === '1'; } catch(e){}
    if (!seen) setTimeout(() => openIntro(0), 2600);
  }, 650);
});
</script>
</body>
